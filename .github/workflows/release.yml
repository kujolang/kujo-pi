name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify release identity
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$expected_tag"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Build release artifact
        run: |
          mkdir release
          npm pack --json --pack-destination release
          mv "release/$(node -e "const fs=require('node:fs');const [f]=fs.readdirSync('release');process.stdout.write(f)")" release/kujo-pi.tgz
          sha256sum release/kujo-pi.tgz > release/kujo-pi.tgz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: sha256sum --check release/kujo-pi.tgz.sha256
      - run: npm publish release/kujo-pi.tgz --provenance --access public

  publish-github:
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: release
      - run: sha256sum --check release/kujo-pi.tgz.sha256
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            release/kujo-pi.tgz
            release/kujo-pi.tgz.sha256
